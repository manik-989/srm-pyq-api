[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# FastAPI uses function calls (Query/Depends) in default arguments by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["api_server"]

[tool.coverage.report]
fail_under = 80
show_missing = true
